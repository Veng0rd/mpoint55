<div class="cookie-banner" id="cookieBanner" style="display: none;">
  <p>Мы используем cookies для улучшения работы сайта. Продолжая использовать наш сайт, вы соглашаетесь с нашей <a href="/privacy.php" target="_blank">Политикой конфиденциальности</a>.</p>

  </div>
</div>

<script>window.initCounters=function(){};
document.addEventListener('DOMContentLoaded', function() {
  const banner = document.getElementById('cookieBanner');
  const acceptBtn = document.getElementById('acceptCookies');
  const rejectBtn = document.getElementById('rejectCookies');
  const consent = localStorage.getItem('cookieConsent');

  if (consent === 'accepted') {
    // Если согласие уже было, запускаем счётчики сразу
    if (typeof window.initCounters === 'function') {
      window.initCounters();
    }
  } else if (!consent) {
    // Если согласия нет, показываем баннер
    banner.style.display = 'flex';
  }
  // Если consent === 'rejected' — ничего не делаем (баннер не показываем, счётчики не запускаем)

  acceptBtn.addEventListener('click', function() {
    localStorage.setItem('cookieConsent', 'accepted');
    banner.style.display = 'none';
    if (typeof window.initCounters === 'function') {
      window.initCounters();
    }
  });

  rejectBtn.addEventListener('click', function() {
    localStorage.setItem('cookieConsent', 'rejected');
    banner.style.display = 'none';
  });
});
</script>
